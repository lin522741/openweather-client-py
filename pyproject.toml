[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openweather-client-py"
version = "0.1.0"
description = "Аккуратный клиент для OpenWeather API: текущая погода, прогноз, CLI и выбор единиц измерения."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Doubao Workspace", email = "your-email@example.com" },
]
keywords = ["weather", "openweather", "openweathermap", "api", "client", "forecast", "погода"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
# TODO: заменить на адрес вашего репозитория перед публикацией.
Homepage = "https://github.com/lin522741/openweather-client-py"
Repository = "https://github.com/lin522741/openweather-client-py"
Documentation = "https://github.com/lin522741/openweather-client-py#readme"

[project.scripts]
openweather = "openweather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openweather = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.coverage.run]
source = ["openweather"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
